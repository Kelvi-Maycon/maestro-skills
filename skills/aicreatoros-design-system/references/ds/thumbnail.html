<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 316px;background:var(--ink);overflow:hidden}
.main{display:grid;place-items:center;background:var(--ink)}
.brand{display:inline-flex;align-items:center;gap:24px;white-space:nowrap}
.wm{font:700 104px/1 var(--sans);letter-spacing:-.05em;color:var(--paper)}
.wm em{font:italic 700 1.12em/1 var(--serif);color:var(--orange);letter-spacing:-.01em}
.strip{display:grid;grid-template-rows:repeat(3,1fr)}.strip span{display:block}</style>
</head><body>
<div class="main"><span class="brand"><img src="assets/logo-mark-inverse.svg" width="150" height="60" alt=""><span class="wm">aicreator<em>os</em></span></span></div>
<div class="strip"><span style="background:#D8F35A"></span><span style="background:#F05A37"></span><span style="background:#F4F1E9"></span></div>
</body></html>
