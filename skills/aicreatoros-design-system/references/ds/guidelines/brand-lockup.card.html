<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 var(--sans);padding:24px}.mono{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1.4;color:var(--muted)}em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--orange);letter-spacing:-.01em}</style>
</head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px"><span style="display:inline-flex;align-items:center;gap:12px;white-space:nowrap"><img src="../assets/logo-mark.svg" width="48" height="19" alt=""><span style="font:700 30px/1 var(--sans);letter-spacing:-.05em">aicreator<em style="font:italic 700 1.12em/1 var(--serif);letter-spacing:-.01em">os</em></span></span></div>
<div style="display:grid;place-items:center;background:var(--ink);border-radius:24px;padding:24px;color:var(--paper)"><span style="display:inline-flex;align-items:center;gap:12px;white-space:nowrap"><img src="../assets/logo-mark-inverse.svg" width="48" height="19" alt=""><span style="font:700 30px/1 var(--sans);letter-spacing:-.05em">aicreator<em style="font:italic 700 1.12em/1 var(--serif);letter-spacing:-.01em">os</em></span></span></div>
</div></body></html>
