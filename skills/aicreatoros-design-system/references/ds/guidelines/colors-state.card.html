<!-- @dsCard group="Colors" viewport="700x210" name="Estado & linha fina" subtitle="Positivo, atenção, negativo e informação: ponto, badge e delta. Nunca decoração" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 var(--sans);padding:24px}.mono{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1.4;color:var(--muted)}em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--orange);letter-spacing:-.01em}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.sw{border-radius:16px;min-height:132px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;line-height:1.35}.sw b{display:block;font:700 17px/1 var(--sans);letter-spacing:-.02em;margin-bottom:2px}.sw i{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}</style>
</head><body><div class="grid">
<div class="sw" style="background:var(--pos-bg);color:var(--pos)"><span class="mono" style="color:inherit"><i></i>Positivo</span><span><b>#2F7A36</b>fundo #EAF3D2</span></div>
<div class="sw" style="background:var(--warn-bg);color:var(--warn)"><span class="mono" style="color:inherit"><i></i>Atenção</span><span><b>#946200</b>fundo #F7ECCF</span></div>
<div class="sw" style="background:var(--neg-bg);color:var(--neg)"><span class="mono" style="color:inherit"><i></i>Negativo</span><span><b>#C42B3E</b>fundo #F8E2E4</span></div>
<div class="sw" style="background:var(--info-bg);color:var(--info)"><span class="mono" style="color:inherit"><i></i>Informação</span><span><b>#2F58C9</b>fundo #E4EAF8</span></div>
<div class="sw" style="background:var(--card);color:var(--ink);border:1px solid var(--line-2)"><span class="mono" style="color:var(--muted)">Linha fina</span><span><b>#E3DED3</b>linha de tabela</span></div>
</div></body></html>
