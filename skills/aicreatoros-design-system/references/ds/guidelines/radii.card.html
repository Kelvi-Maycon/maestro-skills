<!-- @dsCard group="Spacing" viewport="700x180" name="Cantos" subtitle="24 painel · 20 slide · 16 mídia e menu · 12 tabela · 8 controle · pílula" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 var(--sans);padding:24px}.mono{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1.4;color:var(--muted)}em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--orange);letter-spacing:-.01em}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end">
<span style="display:grid;gap:8px"><span style="height:72px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)"></span><span class="mono">24 px</span><span style="font-size:12px;color:var(--muted)">painel, card</span></span><span style="display:grid;gap:8px"><span style="height:72px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-slide)"></span><span class="mono">20 px</span><span style="font-size:12px;color:var(--muted)">slide</span></span><span style="display:grid;gap:8px"><span style="height:72px;background:var(--card);border:1px solid var(--line);border-radius:16px"></span><span class="mono">16 px</span><span style="font-size:12px;color:var(--muted)">imagem, menu</span></span><span style="display:grid;gap:8px"><span style="height:72px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2)"></span><span class="mono">12 px</span><span style="font-size:12px;color:var(--muted)">tabela, toast</span></span><span style="display:grid;gap:8px"><span style="height:72px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctl)"></span><span class="mono">8 px</span><span style="font-size:12px;color:var(--muted)">botão, campo</span></span><span style="display:grid;gap:8px"><span style="height:72px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill)"></span><span class="mono">999 px</span><span style="font-size:12px;color:var(--muted)">chip, badge</span></span>
</div></body></html>
