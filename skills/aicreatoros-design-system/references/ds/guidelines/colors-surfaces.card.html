<!-- @dsCard group="Colors" viewport="700x200" name="Superfícies & linhas" subtitle="Papel de página, card, apoio e as duas linhas" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 var(--sans);padding:24px}.mono{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1.4;color:var(--muted)}em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--orange);letter-spacing:-.01em}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.sw{border-radius:16px;min-height:132px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;line-height:1.35}.sw b{display:block;font:700 17px/1 var(--sans);letter-spacing:-.02em;margin-bottom:2px}</style>
</head><body><div class="grid">
<div class="sw" style="background:#F7F4EE;color:#1D1D1B"><span class="mono" style="color:inherit;opacity:.85">Página</span><span><b>#F7F4EE</b>fundo do documento</span></div>
<div class="sw" style="background:#FFFDFA;color:#1D1D1B"><span class="mono" style="color:inherit;opacity:.85">Card</span><span><b>#FFFDFA</b>superfície de card</span></div>
<div class="sw" style="background:#E8E4DB;color:#1D1D1B"><span class="mono" style="color:inherit;opacity:.85">Apoio</span><span><b>#E8E4DB</b>fundo do produto</span></div>
<div class="sw" style="background:#CBC6BB;color:#1D1D1B"><span class="mono" style="color:inherit;opacity:.85">Linha</span><span><b>#CBC6BB</b>borda e divisória</span></div>
</div></body></html>
